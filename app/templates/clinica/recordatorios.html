{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Mis Recordatorios</h2>
    <hr>

    {% if recordatorios %}
    <div class="list-group">
        {% for recordatorio in recordatorios %}
        <div class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <p class="mb-1">{{ recordatorio.mensaje }}</p>
                <small class="text-muted">{{ recordatorio.fecha_creacion|date:"d/m/Y H:i" }}</small>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="alert alert-info">No tienes recordatorios.</div>
    {% endif %}
</div>
{% endblock %}
